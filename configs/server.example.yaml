# PolyFleet listens only on loopback. Terminate TLS in a reverse proxy.
listen: 127.0.0.1:8080
public_url: https://hyfleet.example.com

database_path: /var/lib/hyfleet/server.db
master_key_file: /var/lib/hyfleet/master.key
cookie_secure: true

session_lifetime: 12h
session_idle_timeout: 30m
stale_after: 45s
offline_after: 90s
