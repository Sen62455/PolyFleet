name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: Existing tag to package
        required: true
        type: string

permissions:
  contents: read

env:
  RELEASE_VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_VERSION }}
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - uses: pnpm/setup@v1
        with:
          version: 11.16.0
          runtime: node@22
          install: false
          cache: true
          cache-dependency-path: web/pnpm-lock.yaml
          package-json-file: web/package.json
      - name: Install frontend dependencies
        working-directory: web
        run: pnpm install --frozen-lockfile
      - name: Verify source
        run: |
          go test ./...
          go test -race ./...
          go vet ./...
          pnpm --dir web typecheck
          pnpm --dir web test
          pnpm --dir web lint:docs
          bash -n install.sh deploy/*.sh tests/*.sh
          shellcheck --severity=warning install.sh deploy/*.sh tests/*.sh
          go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
          git diff --check

  build:
    needs: verify
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        architecture: [amd64, arm64]
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_VERSION }}
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - uses: pnpm/setup@v1
        with:
          version: 11.16.0
          runtime: node@22
          install: false
          cache: true
          cache-dependency-path: web/pnpm-lock.yaml
          package-json-file: web/package.json
      - name: Build pinned Reality data plane
        shell: pwsh
        run: bash scripts/build-sing-box-reality.sh
      - name: Package release bundle
        shell: pwsh
        run: >-
          ./scripts/build-release.ps1
          -Architecture ${{ matrix.architecture }}
          -Version $env:RELEASE_VERSION
      - uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.architecture }}
          path: |
            output/releases/polyfleet-${{ env.RELEASE_VERSION }}-linux-${{ matrix.architecture }}.tar.gz
            output/releases/polyfleet-${{ env.RELEASE_VERSION }}-linux-${{ matrix.architecture }}.tar.gz.sha256
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: release-*
          path: release
          merge-multiple: true
      - name: Verify native release assets
        run: |
          mapfile -t native_assets < <(find release -maxdepth 1 -type f -print | sort)
          if [[ ${#native_assets[@]} -ne 4 ]]; then
            printf 'Expected four native release assets, found %s\n' "${#native_assets[@]}" >&2
            exit 1
          fi
          mkdir -p sbom/amd64 sbom/arm64
          tar -xzf "release/polyfleet-${RELEASE_VERSION}-linux-amd64.tar.gz" -C sbom/amd64
          tar -xzf "release/polyfleet-${RELEASE_VERSION}-linux-arm64.tar.gz" -C sbom/arm64
      - name: Generate amd64 SPDX SBOM
        uses: anchore/sbom-action@v0
        with:
          path: sbom/amd64
          format: spdx-json
          output-file: release/polyfleet-${{ env.RELEASE_VERSION }}-linux-amd64.spdx.json
          artifact-name: polyfleet-${{ env.RELEASE_VERSION }}-linux-amd64.spdx.json
          upload-artifact: false
          upload-release-assets: false
      - name: Generate arm64 SPDX SBOM
        uses: anchore/sbom-action@v0
        with:
          path: sbom/arm64
          format: spdx-json
          output-file: release/polyfleet-${{ env.RELEASE_VERSION }}-linux-arm64.spdx.json
          artifact-name: polyfleet-${{ env.RELEASE_VERSION }}-linux-arm64.spdx.json
          upload-artifact: false
          upload-release-assets: false
      - uses: sigstore/cosign-installer@v4.1.0
      - name: Sign release blobs with GitHub OIDC
        run: |
          mapfile -t unsigned_assets < <(find release -maxdepth 1 -type f -print | sort)
          if [[ ${#unsigned_assets[@]} -ne 6 ]]; then
            printf 'Expected six unsigned assets, found %s\n' "${#unsigned_assets[@]}" >&2
            exit 1
          fi
          for asset in "${unsigned_assets[@]}"; do
            cosign sign-blob --yes --bundle "${asset}.sigstore.json" "${asset}"
          done
      - name: Publish public release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          mapfile -t assets < <(find release -maxdepth 1 -type f -print | sort)
          if [[ ${#assets[@]} -ne 12 ]]; then
            printf 'Expected twelve signed release assets, found %s\n' "${#assets[@]}" >&2
            exit 1
          fi
          if gh release view "${RELEASE_VERSION}" >/dev/null 2>&1; then
            gh release upload "${RELEASE_VERSION}" "${assets[@]}" --clobber
          else
            release_args=("${RELEASE_VERSION}" "${assets[@]}" --verify-tag --generate-notes --title "PolyFleet ${RELEASE_VERSION}")
            if [[ "${RELEASE_VERSION}" == *-* ]]; then
              release_args+=(--prerelease)
            fi
            gh release create "${release_args[@]}"
          fi

  container:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_VERSION }}
          fetch-depth: 0
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: metadata
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/sen62455/polyfleet
          tags: |
            type=raw,value=${{ env.RELEASE_VERSION }}
            type=raw,value=latest,enable=${{ !contains(env.RELEASE_VERSION, '-') }}
      - id: buildinfo
        run: printf 'date=%s\n' "$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "${GITHUB_OUTPUT}"
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          build-args: |
            VERSION=${{ env.RELEASE_VERSION }}
            COMMIT=${{ github.sha }}
            BUILD_DATE=${{ steps.buildinfo.outputs.date }}
          provenance: mode=max
          sbom: true
      - uses: sigstore/cosign-installer@v4.1.0
      - name: Sign container digest with GitHub OIDC
        env:
          IMAGE: ghcr.io/sen62455/polyfleet
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "${IMAGE}@${DIGEST}"
