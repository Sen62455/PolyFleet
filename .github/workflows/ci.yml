name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - uses: pnpm/setup@v1
        with:
          version: 11.16.0
          runtime: node@22
          install: false
          cache: true
          cache-dependency-path: web/pnpm-lock.yaml
          package-json-file: web/package.json

      - name: Install frontend dependencies
        working-directory: web
        run: pnpm install --frozen-lockfile

      - name: Check Go formatting
        shell: bash
        run: test -z "$(gofmt -l ./cmd ./internal)"

      - name: Check deployment scripts
        shell: bash
        run: |
          bash -n install.sh deploy/*.sh tests/*.sh
          shellcheck --severity=warning install.sh deploy/*.sh tests/*.sh

      - name: Lint GitHub Actions
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12

      - name: Verify Go modules
        run: go mod verify

      - name: Vet and test Go
        run: |
          go vet ./...
          go test -race ./...

      - name: Test frontend and documentation
        working-directory: web
        run: |
          pnpm typecheck
          pnpm test
          pnpm lint:docs

      - name: Build embedded frontend
        working-directory: web
        run: pnpm build

      - name: Build Linux release binaries
        shell: bash
        run: |
          mkdir -p bin
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -tags webui -o bin/hyfleet-server-linux-amd64 ./cmd/server
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -o bin/hyfleet-agent-linux-amd64 ./cmd/agent
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -o bin/hyfleet-agent-ops-linux-amd64 ./cmd/agentops
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -tags webui -o bin/hyfleet-server-linux-arm64 ./cmd/server
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -o bin/hyfleet-agent-linux-arm64 ./cmd/agent
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -o bin/hyfleet-agent-ops-linux-arm64 ./cmd/agentops

      - name: Verify Agent systemd units
        shell: bash
        run: |
          grep -Fx 'ProtectProc=default' deploy/systemd/hyfleet-agent.service
          grep -Fx 'ProcSubset=all' deploy/systemd/hyfleet-agent.service
          grep -Fx 'ExecStartPre=/usr/bin/test -r /proc/stat' deploy/systemd/hyfleet-agent.service
          sudo groupadd --system hyfleet-agent
          sudo useradd --system --gid hyfleet-agent --home-dir /var/lib/hyfleet-agent \
            --shell /usr/sbin/nologin hyfleet-agent
          sudo groupadd --system hyfleet-singbox
          sudo useradd --system --gid hyfleet-singbox --home-dir /var/lib/hyfleet-singbox \
            --shell /usr/sbin/nologin hyfleet-singbox
          sudo install -d -m 0755 /etc/hyfleet /usr/local/libexec
          sudo install -d -o hyfleet-singbox -g hyfleet-singbox -m 0750 /var/lib/hyfleet-singbox
          sudo install -d -m 0700 /var/lib/hyfleet-agent /var/lib/hyfleet-backups /var/lib/hyfleet-agent-ops
          sudo install -m 0755 bin/hyfleet-agent-linux-amd64 /usr/local/bin/hyfleet-agent
          sudo install -m 0755 bin/hyfleet-agent-ops-linux-amd64 /usr/local/libexec/hyfleet-agent-ops
          sudo install -m 0755 /bin/true /usr/bin/sing-box
          systemd-analyze verify \
            deploy/systemd/hyfleet-agent.service \
            deploy/systemd/hyfleet-agent-ops.socket \
            deploy/systemd/hyfleet-agent-ops@.service \
            deploy/systemd/hyfleet-sing-box-reality.service

  secrets:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  e2e-package:
    needs: test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - uses: pnpm/setup@v1
        with:
          version: 11.16.0
          runtime: node@22
          install: false
          cache: true
          cache-dependency-path: web/pnpm-lock.yaml
          package-json-file: web/package.json
      - name: Build clean-host test bundle
        shell: pwsh
        run: bash scripts/build-sing-box-reality.sh
      - name: Package clean-host test bundle
        shell: pwsh
        run: ./scripts/build-release.ps1 -Architecture amd64 -Version v1.0.0-ci
      - uses: actions/upload-artifact@v7
        with:
          name: e2e-linux-amd64
          path: |
            output/releases/polyfleet-v1.0.0-ci-linux-amd64.tar.gz
            output/releases/polyfleet-v1.0.0-ci-linux-amd64.tar.gz.sha256
          if-no-files-found: error

  native-install:
    needs: e2e-package
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        base_image: ["ubuntu:24.04", "debian:12", "debian:13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: e2e-linux-amd64
          path: e2e
      - name: Extract release bundle
        shell: bash
        run: |
          (cd e2e && sha256sum -c polyfleet-v1.0.0-ci-linux-amd64.tar.gz.sha256)
          tar -xzf e2e/polyfleet-v1.0.0-ci-linux-amd64.tar.gz -C e2e
          (cd e2e/polyfleet-v1.0.0-ci-linux-amd64 && sha256sum -c SHA256SUMS)
      - name: Install, upgrade, back up, and restore
        shell: bash
        run: >-
          bash tests/install-e2e.sh
          '${{ matrix.base_image }}'
          e2e/polyfleet-v1.0.0-ci-linux-amd64

  container:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Validate Compose model
        run: docker compose --env-file docker/.env.example -f docker/compose.yaml config --quiet
      - name: Build Server image
        run: >-
          docker build
          --file docker/Dockerfile
          --build-arg VERSION=v1.0.0-ci
          --build-arg "COMMIT=${GITHUB_SHA::12}"
          --build-arg BUILD_DATE=ci
          --tag polyfleet:e2e
          .
      - name: Run Server image
        shell: bash
        run: |
          set -Eeuo pipefail
          cleanup() { docker rm -f polyfleet-container-e2e >/dev/null 2>&1 || true; }
          trap cleanup EXIT
          docker run --detach --name polyfleet-container-e2e \
            --read-only --cap-drop ALL --security-opt no-new-privileges:true \
            --tmpfs /tmp:rw,noexec,nosuid,nodev,size=16m \
            --publish 127.0.0.1:18080:8080 \
            --env HYFLEET_PUBLIC_URL=https://panel.example.com \
            polyfleet:e2e
          healthy=false
          for _ in {1..30}; do
            health_status="$(docker inspect --format '{{.State.Health.Status}}' polyfleet-container-e2e)"
            if curl --fail --silent http://127.0.0.1:18080/healthz >/dev/null 2>&1 && \
              [[ "${health_status}" == "healthy" ]]; then
              healthy=true
              break
            fi
            sleep 1
          done
          [[ "${healthy}" == true ]]
          docker exec polyfleet-container-e2e \
            /usr/local/bin/hyfleet-server -check-database /data/server.db
